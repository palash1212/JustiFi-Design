                  </div>
                </div>
                <p class="text-body-md font-body-md text-on-surface-variant">Very professional and clear in communication. He explained every step of the writ petition process to us.</p>
              </div>
            </div>
          </div>
        </section>

        <!-- Similar Advocates Section -->
        <section class="mt-stack-lg">
          <h2 class="font-headline-md text-headline-md text-primary mb-8 flex items-center justify-between">
            <span class="flex items-center gap-2">
              <span class="material-symbols-outlined">groups</span>
              Other Expert Advocates
            </span>
            <a class="text-body-md font-body-md text-warm-gold hover:underline" href="lawyer_list.html">View All</a>
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-gutter">
            ${LAWYERS.filter((l) => l.id !== lawyer.id)
              .slice(0, 3)
              .map(
                (l) => `
              <a href="lawyer-profile.html?lawyer=${l.id}" class="bg-surface-container-lowest rounded-xl border border-outline-variant/10 p-6 flex items-center gap-4 hover:shadow-lg transition-all cursor-pointer">
                <div class="w-20 h-20 rounded-lg bg-surface-container overflow-hidden shrink-0">
                  ${l.img ? `<img src="${l.img}" alt="${l.name}" class="w-full h-full object-cover" />` : `<div class="w-full h-full flex items-center justify-center text-3xl text-surface-variant">${l.init}</div>`}
                </div>
                <div>
                  <h4 class="font-label-md text-label-md text-primary">${l.name}</h4>
                  <p class="text-caption font-caption text-on-surface-variant mb-2">${l.dept} Specialist</p>
                  <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-warm-gold text-[14px]" style="font-variation-settings: 'FILL' 1;">star</span>
                    <span class="text-[12px] font-bold">${(4.5 + Math.random() * 0.5).toFixed(1)}</span>
                    <span class="text-[12px] text-outline">• ${Math.floor(8 + Math.random() * 17)} Years Exp</span>
                  </div>
                </div>
              </a>
            `,
              )
              .join("")}
          </div>
        </section>
      `;

        document.getElementById("profileMain").innerHTML = profileHTML;
      })();
    </script>
  </body>
</html>
