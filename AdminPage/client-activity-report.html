<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Activity Report — JustiFi Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','sans-serif'] },
    colors: { navy: { DEFAULT:'#1A2B3C', 50:'#EBEEF2', 800:'#152233' }, gold: { DEFAULT:'#C5A059', 50:'#FBF6ED' }, slate2:'#64748B', offwhite:'#F8FAFC' },
    boxShadow: { card: '0 1px 3px 0 rgba(26,43,60,0.08), 0 1px 2px -1px rgba(26,43,60,0.06)' }
  } } }
</script>
<link rel="stylesheet" href="css/style.css">
<style>
  /* ═══ Page Hero ═══ */
  .page-hero {
    background: linear-gradient(135deg, #1A2B3C 0%, #152233 100%);
    border-radius: 14px;
    padding: 18px 24px;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .page-hero::after {
    content: ''; position: absolute; top: 0; right: 0;
    width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(197,160,89,0.15), transparent 70%);
    border-radius: 50%; transform: translate(30%, -30%);
  }
  .page-hero::before {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 3px; background: linear-gradient(90deg, #C5A059, #F5E8C8, #C5A059);
  }

  /* ═══ Section Title ═══ */
  .section-title {
    font-size: 11px; font-weight: 700; color: #1A2B3C;
    text-transform: uppercase; letter-spacing: 0.06em;
    display: flex; align-items: center; gap: 7px;
    margin-bottom: 10px;
  }
  .section-title .bar { width: 3px; height: 12px; background: #C5A059; border-radius: 2px; }

  /* ═══ Stat tile ═══ */
  .stat-tile {
    background: #F8FAFC; border: 1px solid #EEF1F4;
    border-radius: 10px;
    padding: 10px 12px;
    transition: all .2s;
    text-align: center;
  }
  .stat-tile:hover {
    border-color: #C5A059; background: #FBF6ED;
    transform: translateY(-1px);
  }
  .stat-tile .num {
    font-size: 20px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .stat-tile .lbl {
    font-size: 9.5px; color: #64748B; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em;
    margin-top: 5px; line-height: 1.2;
  }

  /* ═══ Change history item (full) ═══ */
  .change-item {
    padding: 12px 14px;
    background: #F8FAFC;
    border-left: 3px solid #CBD5E1;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .change-item.phone    { border-left-color: #3B82F6; background: #EFF6FF; }
  .change-item.email    { border-left-color: #8B5CF6; background: #F5F3FF; }
  .change-item.name     { border-left-color: #C5A059; background: #FBF6ED; }
  .change-item.address  { border-left-color: #10B981; background: #F0FDF4; }
  .change-item.avatar   { border-left-color: #F59E0B; background: #FFFBEB; }
  .change-item.account  { border-left-color: #EF4444; background: #FEF2F2; }
  .change-item .c-title { font-size: 12.5px; font-weight: 700; color: #1A2B3C; }
  .change-item .c-meta  { font-size: 10.5px; color: #94A3B8; margin-top: 2px; }
  .change-item .c-diff {
    margin-top: 8px; padding: 8px 10px;
    background: rgba(255,255,255,0.85);
    border-radius: 7px; font-size: 12px; line-height: 1.5;
  }
  .change-item .c-diff .lbl-mini {
    font-size: 9px; font-weight: 700; color: #64748B;
    text-transform: uppercase; letter-spacing: 0.05em;
    display: block; margin-bottom: 4px;
  }
  .change-item .c-diff .old {
    color: #B91C1C; text-decoration: line-through;
    background: rgba(239,68,68,0.08);
    padding: 2px 7px; border-radius: 5px;
    display: inline-block; margin-bottom: 3px;
  }
  .change-item .c-diff .new {
    color: #166534; background: rgba(34,197,94,0.1);
    padding: 2px 7px; border-radius: 5px;
    display: inline-block; font-weight: 600;
  }
  .change-item .c-diff .arr {
    color: #94A3B8; margin: 0 6px;
    font-size: 13px; vertical-align: middle;
  }
  .change-item .c-by {
    font-size: 10.5px; color: #64748B; margin-top: 6px;
    display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
  }
  .change-item .c-by .who {
    background: #E2E8F0; color: #475569;
    padding: 2px 7px; border-radius: 5px;
    font-weight: 700; text-transform: uppercase; font-size: 9px;
  }
  .change-item .c-by .who.user  { background: #DBEAFE; color: #1E40AF; }
  .change-item .c-by .who.admin { background: #FEF3C7; color: #92400E; }
  .change-item .c-by .who.system{ background: #F1F5F9; color: #475569; }
  .change-item .c-by .reason-tag {
    background: #FFFBEB; color: #78350F;
    padding: 2px 7px; border-radius: 5px;
    font-size: 10px;
    border: 1px solid #FDE68A;
  }

  /* ═══ Filter chips ═══ */
  .filter-chip {
    padding: 5px 12px;
    font-size: 11.5px; font-weight: 600;
    border-radius: 999px;
    border: 1.5px solid #E2E8F0;
    background: #fff; color: #64748B;
    cursor: pointer; transition: all .15s;
    white-space: nowrap;
  }
  .filter-chip:hover { border-color: #C5A059; color: #1A2B3C; }
  .filter-chip.active {
    background: #1A2B3C; color: #fff;
    border-color: #1A2B3C;
  }

  /* ═══ Back button ═══ */
  .btn-back {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 600; color: #64748B;
    padding: 5px 11px; border-radius: 7px;
    border: 1px solid #E2E8F0; background: #fff;
    transition: all .15s; cursor: pointer;
  }
  .btn-back:hover { color: #1A2B3C; border-color: #C5A059; background: #FBF6ED; }
</style>
</head>
<body class="bg-offwhite text-navy">
<div class="flex h-screen overflow-hidden">
  <aside id="sidebar-mount" class="w-72 bg-navy text-white flex-shrink-0 flex flex-col"></aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 flex-shrink-0">
      <div class="flex items-center gap-3 w-96 bg-offwhite border border-slate-200 rounded-lg px-3 py-2">
        <svg class="w-4 h-4 text-slate2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input class="bg-transparent text-sm outline-none w-full placeholder:text-slate2" placeholder="Search client, lawyer, booking, transaction ID...">
      </div>
      <div class="flex items-center gap-5">
        <button class="relative text-slate2 hover:text-navy"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span></button>
        <div class="h-6 w-px bg-slate-200"></div>
        <div class="flex items-center gap-2 text-sm"><span class="dot bg-emerald-500"></span><span class="text-slate2">All systems operational</span></div>
      </div>
    </header>
    <main class="flex-1 overflow-y-auto p-5 space-y-3">

      <!-- Back -->
      <div class="flex items-center justify-between">
        <button id="backBtn" class="btn-back">
          ← Back to Client
        </button>
      </div>

      <!-- ═══ Hero (compact) ═══ -->
      <div class="page-hero">
        <div class="relative z-10 flex items-center justify-between gap-4">
          <div class="min-w-0">
            <p class="text-[9.5px] font-bold tracking-widest text-white/50 uppercase">Client Activity Report</p>
            <h1 class="text-lg font-bold text-white mt-1 truncate" id="reportName">Mahmudul Karim</h1>
            <p class="text-xs text-white/55 mt-0.5 truncate" id="reportMeta">CLI-10234 · mahmud@mail.com</p>
          </div>
          <div class="text-right flex-shrink-0">
            <div class="text-white/45 text-[9.5px] font-bold uppercase tracking-wider">Total Changes</div>
            <div class="text-2xl font-extrabold text-gold leading-tight mt-0.5" id="reportTotalChanges">6</div>
          </div>
        </div>
      </div>

      <!-- ═══ Summary stats ═══ -->
      <div class="grid grid-cols-5 gap-2.5">
        <div class="stat-tile">
          <div class="num" style="color: #1A2B3C;" id="rsTotal">6</div>
          <div class="lbl">Total Changes</div>
        </div>
        <div class="stat-tile">
          <div class="num" style="color: #3B82F6;" id="rsPhone">1</div>
          <div class="lbl">Phone Updates</div>
        </div>
        <div class="stat-tile">
          <div class="num" style="color: #8B5CF6;" id="rsEmail">1</div>
          <div class="lbl">Email Updates</div>
        </div>
        <div class="stat-tile">
          <div class="num" style="color: #F59E0B;" id="rsAvatar">2</div>
          <div class="lbl">Picture Updates</div>
        </div>
        <div class="stat-tile">
          <div class="num" style="color: #10B981;" id="rsAddress">1</div>
          <div class="lbl">Address Updates</div>
        </div>
      </div>

      <!-- ═══ Filters (moved up — right after stats) ═══ -->
      <div class="bg-white rounded-xl shadow-card border border-slate-100 p-3.5">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-[10px] font-bold text-slate2 uppercase tracking-wide mr-1.5">Filter:</span>
          <button class="filter-chip active" data-filter="all" onclick="setFilter('all', this)">All Changes</button>
          <button class="filter-chip" data-filter="phone" onclick="setFilter('phone', this)">📱 Phone</button>
          <button class="filter-chip" data-filter="email" onclick="setFilter('email', this)">✉️ Email</button>
          <button class="filter-chip" data-filter="name" onclick="setFilter('name', this)">👤 Name</button>
          <button class="filter-chip" data-filter="address" onclick="setFilter('address', this)">🏠 Address</button>
          <button class="filter-chip" data-filter="avatar" onclick="setFilter('avatar', this)">📷 Picture</button>
          <button class="filter-chip" data-filter="account" onclick="setFilter('account', this)">💳 Account</button>

          <span class="ml-auto text-[10.5px] text-slate2">
            Showing <strong id="visibleCount" class="text-navy">6</strong> of <strong id="totalCount" class="text-navy">6</strong>
          </span>
        </div>
      </div>

      <!-- ═══ Full Change Log ═══ -->
      <div class="bg-white rounded-xl shadow-card border border-slate-100 p-4">
        <div class="section-title"><span class="bar"></span> Full Change Log</div>
        <div id="changeList"></div>
      </div>

    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   CLIENT ACTIVITY REPORT
   ═══════════════════════════════════════════════════════════════════ */

const CLIENTS_DB = {
  'CLI-10234': {
    id: 'CLI-10234', name: 'Mahmudul Karim', email: 'mahmud@mail.com',
    changes: [
      { field: 'phone',   label: 'Phone Number', oldValue: '+880 1712-000000', newValue: '+880 1712-345678', changedBy: 'user', changedAt: '15 Mar 2025, 02:30 PM', reason: 'User updated contact number.' },
      { field: 'avatar',  label: 'Profile Picture', oldValue: 'Initial Upload', newValue: 'Second Upload', changedBy: 'user', changedAt: '15 Mar 2025, 02:35 PM', reason: null },
      { field: 'address', label: 'Address', oldValue: 'Mohammadpur, Dhaka', newValue: 'House 12, Road 5, Dhanmondi, Dhaka', changedBy: 'user', changedAt: '02 Apr 2025, 11:00 AM', reason: 'Relocated to new address.' },
      { field: 'avatar',  label: 'Profile Picture', oldValue: 'Second Upload', newValue: 'Current Picture', changedBy: 'user', changedAt: '20 Jun 2025, 09:15 AM', reason: null },
      { field: 'email',   label: 'Email', oldValue: 'mahmud.old@mail.com', newValue: 'mahmud@mail.com', changedBy: 'user', changedAt: '05 Jul 2025, 04:20 PM', reason: 'Updated to primary email.' },
      { field: 'name',    label: 'Full Name', oldValue: 'Md. Mahmudul Karim', newValue: 'Mahmudul Karim', changedBy: 'user', changedAt: '10 Aug 2025, 10:00 AM', reason: 'Corrected spelling.' }
    ]
  },
  'CLI-88214': {
    id: 'CLI-88214', name: 'Abdullah Hasan', email: 'abdullah@mail.com',
    changes: [
      { field: 'phone', label: 'Phone Number', oldValue: '+880 1819-000000', newValue: '+880 1819-556677', changedBy: 'user', changedAt: '15 Apr 2025, 05:00 PM', reason: 'Updated to new SIM.' }
    ]
  },
  'CLI-10891': {
    id: 'CLI-10891', name: 'Shirin Rahman', email: 'shirin@mail.com',
    changes: []
  },
  'CLI-10892': {
    id: 'CLI-10892', name: 'Nasrin Akter', email: 'nasrin@mail.com',
    changes: []
  },
  'CLI-10893': {
    id: 'CLI-10893', name: 'Tania Islam', email: 'tania@mail.com',
    changes: []
  }
};

let currentFilter = 'all';
let currentClient = null;

function getClientIdFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('id') || 'CLI-10234';
}

/* ─── Render header info ─── */
function renderHeader() {
  const id = getClientIdFromUrl();
  const c = CLIENTS_DB[id];
  if (!c) {
    document.querySelector('main').innerHTML = `
      <div class="p-12 text-center">
        <p class="text-lg font-bold text-navy">Client not found</p>
        <a href="clients.html" class="text-gold font-semibold underline mt-2 inline-block">← Back to Clients</a>
      </div>`;
    return false;
  }
  currentClient = c;

  document.getElementById('reportName').textContent = c.name;
  document.getElementById('reportMeta').textContent = `${c.id} · ${c.email}`;
  document.getElementById('reportTotalChanges').textContent = c.changes.length;

  document.getElementById('backBtn').onclick = () => {
    window.location.href = `client-information.html?id=${encodeURIComponent(id)}`;
  };

  // Summary stats
  const counts = { phone: 0, email: 0, avatar: 0, address: 0, name: 0, account: 0 };
  c.changes.forEach(ch => { if (counts[ch.field] !== undefined) counts[ch.field]++; });

  document.getElementById('rsTotal').textContent   = c.changes.length;
  document.getElementById('rsPhone').textContent   = counts.phone;
  document.getElementById('rsEmail').textContent   = counts.email;
  document.getElementById('rsAvatar').textContent  = counts.avatar;
  document.getElementById('rsAddress').textContent = counts.address;

  document.title = `${c.name} — Activity Report`;
  return true;
}

/* ─── Render change list ─── */
function renderChangeList() {
  const c = currentClient;
  const all = [...c.changes].reverse();  // newest first
  const filtered = currentFilter === 'all' ? all : all.filter(ch => ch.field === currentFilter);

  document.getElementById('visibleCount').textContent = filtered.length;
  document.getElementById('totalCount').textContent   = all.length;

  const el = document.getElementById('changeList');
  if (filtered.length === 0) {
    el.innerHTML = `<p class="text-xs text-slate2 italic py-6 text-center">
      No ${currentFilter === 'all' ? '' : currentFilter} changes recorded.
    </p>`;
    return;
  }
  el.innerHTML = filtered.map(ch => renderChangeItem(ch)).join('');
}

/* ─── Render one change item ─── */
function renderChangeItem(ch) {
  const isAvatar = ch.field === 'avatar';
  const whoClass = ch.changedBy === 'user' ? 'user' : ch.changedBy === 'admin' ? 'admin' : 'system';
  const whoLabel = ch.changedBy === 'user' ? 'User' : ch.changedBy === 'admin' ? 'Admin' : 'System';

  return `
    <div class="change-item ${ch.field}">
      <div class="c-title">${ch.label} ${isAvatar ? '📷' : ''}</div>
      <div class="c-meta">${ch.changedAt}</div>
      <div class="c-diff">
        <span class="lbl-mini">Previous Value</span>
        <span class="old">${ch.oldValue}</span>
        <span class="arr">→</span>
        <span class="new">${ch.newValue}</span>
      </div>
      <div class="c-by">
        Changed by <span class="who ${whoClass}">${whoLabel}</span>
        ${ch.reason ? `<span class="reason-tag">Reason: ${ch.reason}</span>` : ''}
      </div>
    </div>`;
}

/* ─── Filter ─── */
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderChangeList();
}

/* ─── Init ─── */
if (renderHeader()) {
  renderChangeList();
}
</script>
</body>
</html>
