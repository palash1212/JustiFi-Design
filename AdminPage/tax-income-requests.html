<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tax & Income Requests — JustiFi Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','sans-serif'] },
    colors: { navy: { DEFAULT:'#1A2B3C', 50:'#EBEEF2', 800:'#152233' }, gold: { DEFAULT:'#C5A059', 50:'#FBF6ED' }, slate2:'#64748B', offwhite:'#F8FAFC' },
    boxShadow: { card: '0 1px 3px 0 rgba(26,43,60,0.08), 0 1px 2px -1px rgba(26,43,60,0.06)' }
  } } }
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-offwhite text-navy">
<div class="flex h-screen overflow-hidden">
  <aside id="sidebar-mount" class="w-72 bg-navy text-white flex-shrink-0 flex flex-col"></aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 flex-shrink-0">
      <div class="flex items-center gap-3 w-96 bg-offwhite border border-slate-200 rounded-lg px-3 py-2">
        <svg class="w-4 h-4 text-slate2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input class="bg-transparent text-sm outline-none w-full placeholder:text-slate2" placeholder="Search...">
      </div>
      <div class="flex items-center gap-5">
        <button class="relative text-slate2 hover:text-navy"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span></button>
        <div class="h-6 w-px bg-slate-200"></div>
        <div class="flex items-center gap-2 text-sm"><span class="dot bg-emerald-500"></span><span class="text-slate2">All systems operational</span></div>
      </div>
    </header>
    <main class="flex-1 overflow-y-auto p-8 space-y-6">

      <div>
        <h1 class="text-2xl font-bold">Tax & Income Requests</h1>
        <p class="text-slate2 text-sm mt-1">All incoming tax & income applications.</p>
      </div>

      <div class="bg-white rounded-2xl shadow-card border border-slate-100 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-offwhite text-slate2 text-xs uppercase tracking-wide">
            <tr>
              <th class="text-left font-semibold px-5 py-3">Request ID</th>
              <th class="text-left font-semibold px-5 py-3">User Name</th>
              <th class="text-left font-semibold px-5 py-3">Service</th>
              <th class="text-left font-semibold px-5 py-3">Location</th>
              <th class="text-left font-semibold px-5 py-3">Progress</th>
              <th class="text-left font-semibold px-5 py-3">Status</th>
              <th class="text-right font-semibold px-5 py-3">Actions</th>
            </tr>
          </thead>
          <tbody id="taxTbody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<div id="modal-view-tax" class="modal-backdrop fixed inset-0 bg-navy/40 items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg">
    <div class="flex items-center justify-between px-6 py-4 border-b">
      <h3 class="font-bold text-lg">Tax Request <span id="viewTaxId"></span></h3>
      <button onclick="closeModal('modal-view-tax')" class="text-slate2">✕</button>
    </div>
    <div class="px-6 py-5 space-y-3 text-sm">
      <div class="flex justify-between"><span class="text-slate2">User</span><span>Nasrin Akter</span></div>
      <div class="flex justify-between"><span class="text-slate2">Service</span><span>Land Development Tax</span></div>
      <div class="flex justify-between"><span class="text-slate2">Documents</span><span>Dakhila, NID</span></div>
      <div class="flex justify-between"><span class="text-slate2">Payment</span><span class="text-emerald-600 font-semibold">Paid ৳2,100</span></div>
    </div>
    <div class="px-6 py-4 border-t flex justify-end">
      <button onclick="closeModal('modal-view-tax')" class="text-sm font-semibold text-slate2 px-4 py-2">Close</button>
    </div>
  </div>
</div>

<div id="modal-assign-tax" class="modal-backdrop fixed inset-0 bg-navy/40 items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg">
    <div class="flex items-center justify-between px-6 py-4 border-b">
      <h3 class="font-bold text-lg">Assign Professional to <span id="assignTaxId"></span></h3>
      <button onclick="closeModal('modal-assign-tax')" class="text-slate2">✕</button>
    </div>
    <div class="px-6 py-5 space-y-2 text-sm">
      <input placeholder="Search professional..." class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mb-2">
      <label class="flex items-center gap-3 p-3 rounded-lg hover:bg-offwhite cursor-pointer border border-slate-100">
        <input type="radio" name="taxPick" class="accent-gold">
        <div><p class="font-medium">Finance Team</p><p class="text-xs text-slate2">Tax specialist · 62 cases</p></div>
      </label>
      <label class="flex items-center gap-3 p-3 rounded-lg hover:bg-offwhite cursor-pointer border border-slate-100">
        <input type="radio" name="taxPick" class="accent-gold">
        <div><p class="font-medium">CA-01</p><p class="text-xs text-slate2">Chartered Accountant · 40 cases</p></div>
      </label>
    </div>
    <div class="px-6 py-4 border-t flex justify-end gap-3">
      <button onclick="closeModal('modal-assign-tax')" class="text-sm font-semibold text-slate2 px-4 py-2">Cancel</button>
      <button onclick="closeModal('modal-assign-tax')" class="bg-navy text-white text-sm font-semibold px-5 py-2.5 rounded-lg">Assign</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
function renderTax() {
  document.getElementById('taxTbody').innerHTML = DATA.taxRequests.map(t => `
    <tr class="hover:bg-offwhite/60">
      <td class="px-5 py-3.5 font-medium">${t.id}</td>
      <td class="px-5 py-3.5">${t.user}</td>
      <td class="px-5 py-3.5 text-slate2">${t.service}</td>
      <td class="px-5 py-3.5 text-slate2">${t.location}</td>
      <td class="px-5 py-3.5">
        <div class="w-32 bg-slate-100 h-2 rounded mb-1"><div class="bg-gold h-2 rounded" style="width:${t.progress}%"></div></div>
        <span class="text-xs text-slate2">${t.progress}%</span>
      </td>
      <td class="px-5 py-3.5">
        <span class="inline-flex items-center gap-1.5 ${t.status==='Processing'?'bg-gold-50 text-gold':'bg-slate-100 text-slate2'} text-xs font-semibold px-2.5 py-1 rounded-full">
          <span class="dot ${t.status==='Processing'?'bg-gold':'bg-slate-400'}"></span>${t.status}
        </span>
      </td>
      <td class="px-5 py-3.5 text-right space-x-1">
        <button class="text-xs font-semibold text-navy border border-slate-200 px-3 py-1.5 rounded-lg" onclick="openTaxView('${t.id}')">View</button>
        ${t.lawyer
          ? `<button class="text-xs font-semibold text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-lg" onclick="openModal('modal-review')">Review</button>`
          : `<button class="text-xs font-semibold bg-navy text-white px-3 py-1.5 rounded-lg" onclick="openTaxAssign('${t.id}')">Assign Professional</button>`}
      </td>
    </tr>`).join('');
}
function openTaxView(id){ document.getElementById('viewTaxId').textContent = id; openModal('modal-view-tax'); }
function openTaxAssign(id){ document.getElementById('assignTaxId').textContent = id; openModal('modal-assign-tax'); }
renderTax();
</script>
</body>
</html>
