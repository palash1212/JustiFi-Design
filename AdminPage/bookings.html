<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking & Consultations — JustiFi Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','sans-serif'] },
    colors: { navy: { DEFAULT:'#1A2B3C', 50:'#EBEEF2', 800:'#152233' }, gold: { DEFAULT:'#C5A059', 50:'#FBF6ED' }, slate2:'#64748B', offwhite:'#F8FAFC' },
    boxShadow: { card: '0 1px 3px 0 rgba(26,43,60,0.08), 0 1px 2px -1px rgba(26,43,60,0.06)' }
  } } }
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-offwhite text-navy">
<div class="flex h-screen overflow-hidden">
  <aside id="sidebar-mount" class="w-72 bg-navy text-white flex-shrink-0 flex flex-col"></aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 flex-shrink-0">
      <div class="flex items-center gap-3 w-96 bg-offwhite border border-slate-200 rounded-lg px-3 py-2">
        <svg class="w-4 h-4 text-slate2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input class="bg-transparent text-sm outline-none w-full placeholder:text-slate2" placeholder="Search client, lawyer, booking, transaction ID...">
      </div>
      <div class="flex items-center gap-5">
        <button class="relative text-slate2 hover:text-navy"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span></button>
        <div class="h-6 w-px bg-slate-200"></div>
        <div class="flex items-center gap-2 text-sm"><span class="dot bg-emerald-500"></span><span class="text-slate2">All systems operational</span></div>
      </div>
    </header>
    <main class="flex-1 overflow-y-auto p-8 space-y-6">

      <div>
        <h1 class="text-2xl font-bold">Booking & Consultations</h1>
        <p class="text-slate2 text-sm mt-1">Complete lifecycle of every lawyer booking.</p>
      </div>

      <div class="flex gap-1 border-b border-slate-200 overflow-x-auto">
        <button class="tab-btn active px-4 py-2.5 text-sm whitespace-nowrap">All</button>
        <button class="tab-btn px-4 py-2.5 text-sm whitespace-nowrap">Pending</button>
        <button class="tab-btn px-4 py-2.5 text-sm whitespace-nowrap">Confirmed</button>
        <button class="tab-btn px-4 py-2.5 text-sm whitespace-nowrap">Completed</button>
        <button class="tab-btn px-4 py-2.5 text-sm whitespace-nowrap">Disputed</button>
      </div>

      <div class="bg-white rounded-2xl shadow-card border border-slate-100 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-offwhite text-slate2 text-xs uppercase tracking-wide">
            <tr>
              <th class="text-left font-semibold px-5 py-3">Booking</th>
              <th class="text-left font-semibold px-5 py-3">Client</th>
              <th class="text-left font-semibold px-5 py-3">Lawyer</th>
              <th class="text-left font-semibold px-5 py-3">Date</th>
              <th class="text-left font-semibold px-5 py-3">Mode</th>
              <th class="text-left font-semibold px-5 py-3">Payment</th>
              <th class="text-right font-semibold px-5 py-3">Status</th>
            </tr>
          </thead>
          <tbody id="bookingsTbody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById('bookingsTbody').innerHTML = DATA.bookings.map(b => `
  <tr class="hover:bg-offwhite/60">
    <td class="px-5 py-3.5 font-medium">${b.id}</td>
    <td class="px-5 py-3.5">${b.client}</td>
    <td class="px-5 py-3.5 text-slate2">${b.lawyer}</td>
    <td class="px-5 py-3.5">${b.date}</td>
    <td class="px-5 py-3.5">${b.mode}</td>
    <td class="px-5 py-3.5">
      <span class="inline-flex items-center gap-1.5 ${b.payment==='Paid'?'bg-emerald-50 text-emerald-700':b.payment==='Pending'?'bg-gold-50 text-gold':'bg-slate-100 text-slate2'} text-xs font-semibold px-2.5 py-1 rounded-full">
        <span class="dot ${b.payment==='Paid'?'bg-emerald-500':b.payment==='Pending'?'bg-gold':'bg-slate-400'}"></span>${b.payment}
      </span>
    </td>
    <td class="px-5 py-3.5 text-right">
      <span class="inline-flex items-center gap-1.5 ${b.status==='Confirmed'?'bg-emerald-50 text-emerald-700':b.status==='Pending'?'bg-gold-50 text-gold':'bg-red-50 text-red-600'} text-xs font-semibold px-2.5 py-1 rounded-full">
        <span class="dot ${b.status==='Confirmed'?'bg-emerald-500':b.status==='Pending'?'bg-gold':'bg-red-500'}"></span>${b.status}
      </span>
    </td>
  </tr>`).join('');
</script>
</body>
</html>
