<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Control Center — JustiFi Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','sans-serif'] },
    colors: { navy: { DEFAULT:'#1A2B3C', 50:'#EBEEF2', 800:'#152233' }, gold: { DEFAULT:'#C5A059', 50:'#FBF6ED' }, slate2:'#64748B', offwhite:'#F8FAFC' },
    boxShadow: { card: '0 1px 3px 0 rgba(26,43,60,0.08), 0 1px 2px -1px rgba(26,43,60,0.06)' }
  } } }
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-offwhite text-navy">
<div class="flex h-screen overflow-hidden">
  <aside id="sidebar-mount" class="w-72 bg-navy text-white flex-shrink-0 flex flex-col"></aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 flex-shrink-0">
      <div class="flex items-center gap-3 w-96 bg-offwhite border border-slate-200 rounded-lg px-3 py-2">
        <svg class="w-4 h-4 text-slate2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input class="bg-transparent text-sm outline-none w-full placeholder:text-slate2" placeholder="Search...">
      </div>
      <div class="flex items-center gap-5">
        <button class="relative text-slate2 hover:text-navy"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span></button>
        <div class="h-6 w-px bg-slate-200"></div>
        <div class="flex items-center gap-2 text-sm"><span class="dot bg-emerald-500"></span><span class="text-slate2">All systems operational</span></div>
      </div>
    </header>
    <main class="flex-1 overflow-y-auto p-8 space-y-6">

      <div>
        <h1 class="text-2xl font-bold">Service Control Center</h1>
        <p class="text-slate2 text-sm mt-1">Turn platform services on, off, or into maintenance.</p>
      </div>

      <div class="grid grid-cols-4 gap-4">
        <div class="bg-white rounded-2xl p-5 shadow-card border">
          <p class="font-semibold text-sm">Lawyer Booking</p>
          <div class="mt-2"><span class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-full"><span class="dot bg-emerald-500"></span>Active</span></div>
          <button onclick="openModal('modal-manage-service')" class="mt-4 w-full bg-offwhite border border-slate-200 text-xs font-semibold py-2 rounded-lg">Manage Service</button>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-card border">
          <p class="font-semibold text-sm">Affidavit</p>
          <div class="mt-2"><span class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-full"><span class="dot bg-emerald-500"></span>Active</span></div>
          <button onclick="openModal('modal-manage-service')" class="mt-4 w-full bg-offwhite border border-slate-200 text-xs font-semibold py-2 rounded-lg">Manage Service</button>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-card border">
          <p class="font-semibold text-sm">Land Verification</p>
          <div class="mt-2"><span class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 text-xs font-semibold px-2.5 py-1 rounded-full"><span class="dot bg-emerald-500"></span>Active</span></div>
          <button onclick="openModal('modal-manage-service')" class="mt-4 w-full bg-offwhite border border-slate-200 text-xs font-semibold py-2 rounded-lg">Manage Service</button>
        </div>
        <div class="bg-white rounded-2xl p-5 shadow-card border">
          <p class="font-semibold text-sm">Tax & Income</p>
          <div class="mt-2"><span class="inline-flex items-center gap-1.5 bg-gold-50 text-gold text-xs font-semibold px-2.5 py-1 rounded-full"><span class="dot bg-gold"></span>Maintenance</span></div>
          <button onclick="openModal('modal-manage-service')" class="mt-4 w-full bg-offwhite border border-slate-200 text-xs font-semibold py-2 rounded-lg">Manage Service</button>
        </div>
      </div>

    </main>
  </div>
</div>

<div id="modal-manage-service" class="modal-backdrop fixed inset-0 bg-navy/40 items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md">
    <div class="flex items-center justify-between px-6 py-4 border-b">
      <h3 class="font-bold text-lg">Manage Service</h3>
      <button onclick="closeModal('modal-manage-service')" class="text-slate2">✕</button>
    </div>
    <div class="px-6 py-5 space-y-4 text-sm">
      <div>
        <label class="text-xs font-semibold text-slate2 block mb-2">Status</label>
        <div class="space-y-2">
          <label class="flex items-center gap-2"><input type="radio" name="svc" checked> Active</label>
          <label class="flex items-center gap-2"><input type="radio" name="svc"> Paused</label>
          <label class="flex items-center gap-2"><input type="radio" name="svc"> Maintenance</label>
          <label class="flex items-center gap-2"><input type="radio" name="svc"> Disabled</label>
        </div>
      </div>
      <input placeholder="Reason (e.g. scheduled maintenance)" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm">
      <textarea rows="2" placeholder="Client-facing message..." class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"></textarea>
    </div>
    <div class="px-6 py-4 border-t flex justify-end gap-3">
      <button onclick="closeModal('modal-manage-service')" class="text-sm font-semibold text-slate2 px-4 py-2">Cancel</button>
      <button onclick="closeModal('modal-manage-service')" class="bg-navy text-white text-sm font-semibold px-5 py-2.5 rounded-lg">Save & Apply</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
