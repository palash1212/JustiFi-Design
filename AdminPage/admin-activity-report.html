<style>

    border-radius: 14px;
    padding: 18px 24px;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .page-hero::after {
    content: ''; position: absolute; top: 0; right: 0;
    width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(197,160,89,0.15), transparent 70%);
    border-radius: 50%; transform: translate(30%, -30%);
  }
  .page-hero::before {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0;
    height: 3px; background: linear-gradient(90deg, #C5A059, #F5E8C8, #C5A059);
  }

  .stat-tile {
    background: #fff; border: 1px solid #EEF1F4;
    border-radius: 12px; padding: 12px 16px;
    transition: all .2s; position: relative; overflow: hidden;
  }
  .stat-tile::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: currentColor; opacity: 0.8;
  }
  .stat-tile:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(26,43,60,0.08); }
  .stat-tile .num { font-size: 22px; font-weight: 800; line-height: 1; }
  .stat-tile .lbl {
    font-size: 10.5px; color: #64748B; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.05em; margin-top: 6px;
  }
  .stat-tile .icon { position: absolute; right: 12px; top: 12px; font-size: 18px; opacity: 0.15; }

  .section-title {
    font-size: 11.5px; font-weight: 700; color: #1A2B3C;
    text-transform: uppercase; letter-spacing: 0.06em;
    display: flex; align-items: center; gap: 7px;
    margin-bottom: 10px;
  }
  .section-title .bar { width: 3px; height: 13px; background: #C5A059; border-radius: 2px; }

  /* ═══ Filter chips ═══ */
  .filter-chip {
    padding: 5px 12px;
    font-size: 11.5px; font-weight: 600;
    border-radius: 999px;
    border: 1.5px solid #E2E8F0;
    background: #fff; color: #64748B;
    cursor: pointer; transition: all .15s;
    white-space: nowrap;
  }
  .filter-chip:hover { border-color: #C5A059; color: #1A2B3C; }
  .filter-chip.active { background: #1A2B3C; color: #fff; border-color: #1A2B3C; }

  /* ═══ Filter inputs ═══ */
  .filter-input, .filter-select {
    border: 1px solid #E2E8F0; border-radius: 8px;
    padding: 7px 12px; font-size: 13px;
    outline: none; transition: border-color .15s;
    background: #F8FAFC; font-family: inherit;
  }
  .filter-input:focus, .filter-select:focus { border-color: #C5A059; background: #fff; }

  .date-range-wrap {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid #E2E8F0; border-radius: 8px;
    padding: 3px 9px 3px 11px; background: #F8FAFC;
  }
  .date-range-wrap:focus-within { border-color: #C5A059; background: #fff; }
  .date-range-wrap .d-label {
    font-size: 10.5px; font-weight: 700; color: #64748B;
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .date-range-wrap input[type="date"] {
    border: 0; background: transparent; font-size: 12px;
    color: #1A2B3C; font-weight: 600; outline: none;
    cursor: pointer; font-family: inherit;
  }

  /* ═══ Action Item ═══ */
  .action-item {
    display: flex; gap: 12px;
    padding: 12px 14px;
    background: #fff;
    border: 1px solid #EEF1F4;
    border-radius: 10px;
    margin-bottom: 8px;
    transition: all .15s;
  }
  .action-item:hover { border-color: #C5A059; box-shadow: 0 4px 12px rgba(26,43,60,0.04); }
  .action-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .action-icon.user     { background: #EFF6FF; color: #3B82F6; }
  .action-icon.lawyer   { background: #FBF6ED; color: #C5A059; }
  .action-icon.affidavit{ background: #F5F3FF; color: #8B5CF6; }
  .action-icon.land     { background: #F0FDF4; color: #10B981; }
  .action-icon.tax      { background: #ECFEFF; color: #06B6D4; }
  .action-icon.payment  { background: #FFFBEB; color: #F59E0B; }
  .action-icon.system   { background: #F1F5F9; color: #64748B; }
  .action-icon.security { background: #FEF2F2; color: #EF4444; }

  .action-body { flex: 1; min-width: 0; }
  .action-title {
    font-size: 12.5px; font-weight: 700; color: #1A2B3C;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .action-meta {
    font-size: 10.5px; color: #94A3B8;
    margin-top: 2px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .action-target {
    font-size: 12px; color: #475569; margin-top: 5px;
    padding: 6px 10px;
    background: #F8FAFC;
    border-left: 2px solid #C5A059;
    border-radius: 0 6px 6px 0;
  }
  .action-target .t-lbl {
    font-size: 9px; font-weight: 700; color: #64748B;
    text-transform: uppercase; letter-spacing: 0.05em;
    display: block; margin-bottom: 2px;
  }
  .action-status {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 9.5px; font-weight: 700;
    padding: 2px 8px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .action-status.success { background: #DCFCE7; color: #166534; }
  .action-status.failed  { background: #FEE2E2; color: #B91C1C; }
  .action-status.pending { background: #FEF3C7; color: #92400E; }

    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 600; color: #64748B;
    padding: 5px 11px; border-radius: 7px;

    transition: all .15s; cursor: pointer;
  }
  .btn-back:hover { color: #1A2B3C; border-color: #C5A059; background: #FBF6ED; }

  }

  document.getElementById('adminName').textContent = currentAdmin.name;
  document.getElementById('adminMeta').textContent = `${currentAdmin.id} · ${currentAdmin.role} · ${currentAdmin.email}`;

  document.getElementById('backBtn').onclick = () => {
    window.location.href = `admin-information.html?id=${encodeURIComponent(id)}`;
  };

  // Hero counts
  const today = new Date().toISOString().slice(0, 10);
  const todayCount = currentAdmin.actions.filter(x => x.date === today).length;
  document.getElementById('heroTotalActions').textContent = currentAdmin.actions.length;
  document.getElementById('heroToday').textContent = `${todayCount} today`;

  // Stats
  const byType = {};
  currentAdmin.actions.forEach(act => { byType[act.type] = (byType[act.type] || 0) + 1; });
  document.getElementById('statTotal').textContent    = currentAdmin.actions.length;
  document.getElementById('statUser').textContent     = byType.user || 0;
  document.getElementById('statLawyer').textContent   = byType.lawyer || 0;
  document.getElementById('statService').textContent  = (byType.affidavit || 0) + (byType.land || 0) + (byType.tax || 0);
  document.getElementById('statSecurity').textContent = (byType.security || 0) + (byType.payment || 0);

  renderLog();
  document.title = `${currentAdmin.name} — Activity Report`;
}

/* ─── RENDER LOG ─── */
function renderLog() {
  const all = currentAdmin.actions;
  const filtered = all.filter(act => {
    if (currentFilter !== 'all' && act.type !== currentFilter) return false;
    if (filters.status && act.status !== filters.status) return false;
    if (filters.search) {
      const hay = `${act.title} ${act.target} ${act.reason || ''}`.toLowerCase();
      if (!hay.includes(filters.search.toLowerCase())) return false;
    }
    if (filters.dateFrom || filters.dateTo) {
      const d = new Date(act.date);
      const f = filters.dateFrom ? new Date(filters.dateFrom) : null;
      const t = filters.dateTo   ? new Date(filters.dateTo)   : null;
      if (f && d < f) return false;
      if (t && d > t) return false;
    }
    return true;
  });

  document.getElementById('visibleCount').textContent = filtered.length;
  document.getElementById('totalCount').textContent   = all.length;
  document.getElementById('clearDateBtn').classList.toggle('hidden', !(filters.dateFrom || filters.dateTo));
  document.getElementById('clearAllBtn').classList.toggle('hidden', !(filters.search || filters.status || filters.dateFrom || filters.dateTo || currentFilter !== 'all'));

  const el = document.getElementById('actionLog');
  if (filtered.length === 0) {
    el.innerHTML = `<p class="text-xs text-slate2 italic py-8 text-center">No actions match your filters.</p>`;
    return;
  }
  el.innerHTML = filtered.map(act => renderActionItem(act)).join('');
}

function renderActionItem(act) {
  return `
    <div class="action-item">
      <div class="action-icon ${act.type}">${act.icon}</div>
      <div class="action-body">
        <div class="action-title">
          ${act.title}
          <span class="action-status ${act.status}">${act.status}</span>
        </div>
        <div class="action-meta">
          <span>🕐 ${act.time}</span>
          <span>·</span>
          <span>${ACTION_LABELS[act.type] || act.type}</span>
        </div>
        <div class="action-target">
          <span class="t-lbl">Target</span>
          ${act.target}
        </div>
        ${act.reason ? `
          <div class="text-[11px] text-slate2 mt-2 italic">
            <strong class="text-navy not-italic">Reason:</strong> ${act.reason}
          </div>` : ''}
      </div>
    </div>`;
}

/* ─── FILTERS ─── */
function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderLog();
}

function clearDateFilter() {
  filters.dateFrom = '';
  filters.dateTo = '';
  document.getElementById('fDateFrom').value = '';
  document.getElementById('fDateTo').value = '';
  renderLog();
}

function clearAllFilters() {
  filters = { search: '', dateFrom: '', dateTo: '', status: '' };
  currentFilter = 'all';
  document.getElementById('fSearch').value = '';
  document.getElementById('fStatus').value = '';
  document.getElementById('fDateFrom').value = '';
  document.getElementById('fDateTo').value = '';
  document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-chip[data-filter="all"]').classList.add('active');
  renderLog();
}

document.getElementById('fSearch').addEventListener('input', (e) => {
  filters.search = e.target.value;
  renderLog();
});
document.getElementById('fStatus').addEventListener('change', (e) => {
  filters.status = e.target.value;
  renderLog();
});
document.getElementById('fDateFrom').addEventListener('change', (e) => {
  filters.dateFrom = e.target.value;
  renderLog();
});
document.getElementById('fDateTo').addEventListener('change', (e) => {
  filters.dateTo = e.target.value;
  renderLog();
});

init();
</script>
</body>
</html>
