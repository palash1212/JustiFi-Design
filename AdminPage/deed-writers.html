<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deed-Writers — JustiFi Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','sans-serif'] },
    colors: { navy: { DEFAULT:'#1A2B3C', 50:'#EBEEF2', 800:'#152233' }, gold: { DEFAULT:'#C5A059', 50:'#FBF6ED' }, slate2:'#64748B', offwhite:'#F8FAFC' },
    boxShadow: { card: '0 1px 3px 0 rgba(26,43,60,0.08), 0 1px 2px -1px rgba(26,43,60,0.06)' }
  } } }
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-offwhite text-navy">
<div class="flex h-screen overflow-hidden">
  <aside id="sidebar-mount" class="w-72 bg-navy text-white flex-shrink-0 flex flex-col"></aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 flex-shrink-0">
      <div class="flex items-center gap-3 w-96 bg-offwhite border border-slate-200 rounded-lg px-3 py-2">
        <svg class="w-4 h-4 text-slate2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input class="bg-transparent text-sm outline-none w-full placeholder:text-slate2" placeholder="Search client, lawyer, booking, transaction ID...">
      </div>
      <div class="flex items-center gap-5">
        <button class="relative text-slate2 hover:text-navy"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span></button>
        <div class="h-6 w-px bg-slate-200"></div>
        <div class="flex items-center gap-2 text-sm"><span class="dot bg-emerald-500"></span><span class="text-slate2">All systems operational</span></div>
      </div>
    </header>
    <main class="flex-1 overflow-y-auto p-8 space-y-6">

      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-2xl font-bold">Deed-Writers</h1>
          <p class="text-slate2 text-sm mt-1">128 registered deed-writers.</p>
        </div>
        <button onclick="openModal('modal-add-deed')" class="flex items-center gap-2 bg-navy text-white text-sm font-semibold px-4 py-2.5 rounded-lg">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Add Deed-Writer
        </button>
      </div>

      <div class="grid grid-cols-4 gap-5">
        <div class="bg-white rounded-2xl p-5 shadow-card border border-slate-100"><p class="text-slate2 text-xs font-medium">Total</p><p class="text-2xl font-bold mt-2">128</p></div>
        <div class="bg-white rounded-2xl p-5 shadow-card border border-slate-100"><p class="text-slate2 text-xs font-medium">Verified</p><p class="text-2xl font-bold mt-2 text-emerald-600">124</p></div>
        <div class="bg-white rounded-2xl p-5 shadow-card border border-slate-100"><p class="text-slate2 text-xs font-medium">Pending</p><p class="text-2xl font-bold mt-2 text-gold">4</p></div>
        <div class="bg-white rounded-2xl p-5 shadow-card border border-slate-100"><p class="text-slate2 text-xs font-medium">Suspended</p><p class="text-2xl font-bold mt-2 text-red-500">0</p></div>
      </div>

      <div class="bg-white rounded-2xl p-4 shadow-card border border-slate-100 flex flex-wrap items-center gap-3">
        <input id="searchDeed" placeholder="Search by name or Registration No..." class="flex-1 min-w-[200px] border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none">
        <select id="filterDeedStatus" class="border border-slate-200 rounded-lg px-3 py-2 text-sm">
          <option value="">All Status</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>

      <div class="bg-white rounded-2xl shadow-card border border-slate-100 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-offwhite text-slate2 text-xs uppercase tracking-wide">
            <tr>
              <th class="text-left font-semibold px-5 py-3">Name</th>
              <th class="text-left font-semibold px-5 py-3">Registration No.</th>
              <th class="text-left font-semibold px-5 py-3">District</th>
              <th class="text-left font-semibold px-5 py-3">Deals</th>
              <th class="text-left font-semibold px-5 py-3">Status</th>
              <th class="text-right font-semibold px-5 py-3">Actions</th>
            </tr>
          </thead>
          <tbody id="deedTbody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<div id="modal-add-deed" class="modal-backdrop fixed inset-0 bg-navy/40 items-center justify-center z-50 p-4">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg">
    <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
      <h3 class="font-bold text-lg">Add Deed-Writer</h3>
      <button onclick="closeModal('modal-add-deed')" class="text-slate2">✕</button>
    </div>
    <div class="px-6 py-5 space-y-4">
      <div class="grid grid-cols-2 gap-4">
        <div><label class="text-xs font-semibold text-slate2">Full Name</label><input class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"></div>
        <div><label class="text-xs font-semibold text-slate2">Registration No.</label><input class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"></div>
      </div>
      <div><label class="text-xs font-semibold text-slate2">District</label><input class="mt-1 w-full border border-slate-200 rounded-lg px-3 py-2 text-sm"></div>
      <div><label class="text-xs font-semibold text-slate2">Certificate Upload</label><div class="mt-1 border-2 border-dashed border-slate-200 rounded-lg py-6 text-center text-xs text-slate2">Drop files or <span class="text-navy font-semibold underline">browse</span></div></div>
    </div>
    <div class="px-6 py-4 border-t flex justify-end gap-3">
      <button onclick="closeModal('modal-add-deed')" class="text-sm font-semibold text-slate2 px-4 py-2">Cancel</button>
      <button onclick="closeModal('modal-add-deed')" class="bg-navy text-white text-sm font-semibold px-5 py-2.5 rounded-lg">Create Deed-Writer</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script><script>
function renderDeed() {
  const q = (document.getElementById('searchDeed').value || '').toLowerCase();
  const s = document.getElementById('filterDeedStatus').value;
  const rows = DATA.deedWriters.filter(d =>
    (!q || d.name.toLowerCase().includes(q) || d.reg.toLowerCase().includes(q)) &&
    (!s || d.status === s));
  document.getElementById('deedTbody').innerHTML = rows.map(d => `
    <tr class="hover:bg-offwhite/60">
      <td class="px-5 py-3.5 font-medium">${d.name}</td>
      <td class="px-5 py-3.5 text-slate2">${d.reg}</td>
      <td class="px-5 py-3.5">${d.area}</td>
      <td class="px-5 py-3.5">${d.deals}</td>
      <td class="px-5 py-3.5">
        <span class="inline-flex items-center gap-1.5 ${d.status==='Active'?'bg-emerald-50 text-emerald-700':'bg-slate-100 text-slate2'} text-xs font-semibold px-2.5 py-1 rounded-full">
          <span class="dot ${d.status==='Active'?'bg-emerald-500':'bg-slate-400'}"></span>${d.status}
        </span>
      </td>
      <td class="px-5 py-3.5 text-right space-x-1">
        <button class="text-xs font-semibold text-navy border border-slate-200 px-3 py-1.5 rounded-lg">View</button>
        ${d.status==='Active'
          ? `<button class="icon-btn gray" title="Deactivate">⏸</button>`
          : `<button class="icon-btn green" title="Activate">▶</button>`}
      </td>
    </tr>`).join('') || `<tr><td colspan="6" class="px-5 py-6 text-center text-slate2 text-sm">No deed-writers found.</td></tr>`;
}
document.getElementById('searchDeed').addEventListener('input', renderDeed);
document.getElementById('filterDeedStatus').addEventListener('change', renderDeed);
renderDeed();
</script>
</body>
</html>
