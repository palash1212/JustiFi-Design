<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login & Active Sessions — JustiFi Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','sans-serif'] },
    colors: { navy: { DEFAULT:'#1A2B3C', 50:'#EBEEF2', 800:'#152233' }, gold: { DEFAULT:'#C5A059', 50:'#FBF6ED' }, slate2:'#64748B', offwhite:'#F8FAFC' },
    boxShadow: { card: '0 1px 3px 0 rgba(26,43,60,0.08), 0 1px 2px -1px rgba(26,43,60,0.06)' }
  } } }
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-offwhite text-navy">
<div class="flex h-screen overflow-hidden">
  <aside id="sidebar-mount" class="w-72 bg-navy text-white flex-shrink-0 flex flex-col"></aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 flex-shrink-0">
      <div class="flex items-center gap-3 w-96 bg-offwhite border border-slate-200 rounded-lg px-3 py-2">
        <svg class="w-4 h-4 text-slate2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input class="bg-transparent text-sm outline-none w-full placeholder:text-slate2" placeholder="Search...">
      </div>
      <div class="flex items-center gap-5">
        <button class="relative text-slate2 hover:text-navy"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span></button>
        <div class="h-6 w-px bg-slate-200"></div>
        <div class="flex items-center gap-2 text-sm"><span class="dot bg-emerald-500"></span><span class="text-slate2">All systems operational</span></div>
      </div>
    </header>
    <main class="flex-1 overflow-y-auto p-8 space-y-6">

      <div>
        <h1 class="text-2xl font-bold">Login & Active Sessions</h1>
        <p class="text-slate2 text-sm mt-1">Track every active and inactive session across all roles.</p>
      </div>

      <div class="bg-white rounded-2xl p-4 shadow-card border border-slate-100 flex flex-wrap items-center gap-3">
        <input id="searchSession" placeholder="Search by user or IP..." class="flex-1 min-w-[200px] border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none">
        <select id="filterRole" class="border border-slate-200 rounded-lg px-3 py-2 text-sm">
          <option value="">All Roles</option>
          <option>Client</option>
          <option>Lawyer</option>
          <option>Deed-Writer</option>
          <option>Admin</option>
        </select>
        <select id="filterSessionStatus" class="border border-slate-200 rounded-lg px-3 py-2 text-sm">
          <option value="">All Status</option>
          <option>Active</option>
          <option>Inactive</option>
        </select>
      </div>

      <div class="bg-white rounded-2xl shadow-card border border-slate-100 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-offwhite text-slate2 text-xs uppercase tracking-wide">
            <tr>
              <th class="text-left font-semibold px-5 py-3">User</th>
              <th class="text-left font-semibold px-5 py-3">Role</th>
              <th class="text-left font-semibold px-5 py-3">Device</th>
              <th class="text-left font-semibold px-5 py-3">IP / Location</th>
              <th class="text-left font-semibold px-5 py-3">Login Time</th>
              <th class="text-left font-semibold px-5 py-3">Status</th>
              <th class="text-left font-semibold px-5 py-3">Risk</th>
              <th class="text-right font-semibold px-5 py-3">Action</th>
            </tr>
          </thead>
          <tbody id="sessionsTbody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
function renderSessions() {
  const q = (document.getElementById('searchSession').value || '').toLowerCase();
  const r = document.getElementById('filterRole').value;
  const s = document.getElementById('filterSessionStatus').value;
  const rows = DATA.sessions.filter(x =>
    (!q || x.user.toLowerCase().includes(q) || x.ip.includes(q)) &&
    (!r || x.role === r) && (!s || x.status === s));

  document.getElementById('sessionsTbody').innerHTML = rows.map(x => `
    <tr class="hover:bg-offwhite/60">
      <td class="px-5 py-3.5 font-medium">${x.user}</td>
      <td class="px-5 py-3.5 text-slate2">${x.role}</td>
      <td class="px-5 py-3.5 text-xs">${x.device}</td>
      <td class="px-5 py-3.5 text-xs"><div>${x.ip}</div><div class="text-slate2">${x.location}</div></td>
      <td class="px-5 py-3.5 text-slate2 text-xs">${x.login}</td>
      <td class="px-5 py-3.5">
        <span class="inline-flex items-center gap-1.5 ${x.status==='Active'?'bg-emerald-50 text-emerald-700':'bg-slate-100 text-slate2'} text-xs font-semibold px-2.5 py-1 rounded-full">
          <span class="dot ${x.status==='Active'?'bg-emerald-500':'bg-slate-400'}"></span>${x.status}
        </span>
      </td>
      <td class="px-5 py-3.5">
        <span class="inline-flex items-center gap-1.5 ${x.risk==='Low'?'bg-emerald-50 text-emerald-700':x.risk==='Medium'?'bg-gold-50 text-gold':'bg-red-50 text-red-600'} text-xs font-semibold px-2.5 py-1 rounded-full">
          <span class="dot ${x.risk==='Low'?'bg-emerald-500':x.risk==='Medium'?'bg-gold':'bg-red-500'}"></span>${x.risk}
        </span>
      </td>
      <td class="px-5 py-3.5 text-right">
        ${x.status==='Active'
          ? `<button class="text-xs font-semibold text-red-500">Terminate</button>`
          : `<button class="text-xs font-semibold text-slate2">View Log</button>`}
      </td>
    </tr>`).join('') || `<tr><td colspan="8" class="text-center py-6 text-slate2 text-sm">No sessions found.</td></tr>`;
}
document.getElementById('searchSession').addEventListener('input', renderSessions);
document.getElementById('filterRole').addEventListener('change', renderSessions);
document.getElementById('filterSessionStatus').addEventListener('change', renderSessions);
renderSessions();
</script>
</body>
</html>
