<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial & Revenue Reports — JustiFi Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: {
    fontFamily: { sans: ['Inter','sans-serif'] },
    colors: { navy: { DEFAULT:'#1A2B3C', 50:'#EBEEF2', 800:'#152233' }, gold: { DEFAULT:'#C5A059', 50:'#FBF6ED' }, slate2:'#64748B', offwhite:'#F8FAFC' },
    boxShadow: { card: '0 1px 3px 0 rgba(26,43,60,0.08), 0 1px 2px -1px rgba(26,43,60,0.06)' }
  } } }
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-offwhite text-navy">
<div class="flex h-screen overflow-hidden">
  <aside id="sidebar-mount" class="w-72 bg-navy text-white flex-shrink-0 flex flex-col"></aside>
  <div class="flex-1 flex flex-col overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 flex-shrink-0">
      <div class="flex items-center gap-3 w-96 bg-offwhite border border-slate-200 rounded-lg px-3 py-2">
        <svg class="w-4 h-4 text-slate2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input class="bg-transparent text-sm outline-none w-full placeholder:text-slate2" placeholder="Search...">
      </div>
      <div class="flex items-center gap-5">
        <button class="relative text-slate2 hover:text-navy"><svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span></button>
        <div class="h-6 w-px bg-slate-200"></div>
        <div class="flex items-center gap-2 text-sm"><span class="dot bg-emerald-500"></span><span class="text-slate2">All systems operational</span></div>
      </div>
    </header>
    <main class="flex-1 overflow-y-auto p-8 space-y-6">

      <div>
        <h1 class="text-2xl font-bold">Financial & Revenue Reports</h1>
        <p class="text-slate2 text-sm mt-1">Financial intelligence across all services.</p>
      </div>

      <div class="grid grid-cols-5 gap-5">
        <div class="bg-white rounded-2xl p-5 shadow-card border"><p class="text-slate2 text-xs">Gross Revenue</p><p class="text-2xl font-bold mt-2">৳6,20,000</p></div>
        <div class="bg-white rounded-2xl p-5 shadow-card border"><p class="text-slate2 text-xs">Platform Revenue</p><p class="text-2xl font-bold mt-2 text-emerald-600">৳62,000</p></div>
        <div class="bg-white rounded-2xl p-5 shadow-card border"><p class="text-slate2 text-xs">Lawyer Payout</p><p class="text-2xl font-bold mt-2">৳5,58,000</p></div>
        <div class="bg-white rounded-2xl p-5 shadow-card border"><p class="text-slate2 text-xs">Refunds</p><p class="text-2xl font-bold mt-2 text-amber-600">৳12,400</p></div>
        <div class="bg-white rounded-2xl p-5 shadow-card border"><p class="text-slate2 text-xs">Pending Settlement</p><p class="text-2xl font-bold mt-2">৳48,900</p></div>
      </div>

      <div class="bg-white rounded-2xl p-4 shadow-card border flex flex-wrap items-center gap-3">
        <select class="border border-slate-200 rounded-lg px-3 py-2 text-sm"><option>Date range</option></select>
        <select class="border border-slate-200 rounded-lg px-3 py-2 text-sm"><option>Service</option></select>
        <select class="border border-slate-200 rounded-lg px-3 py-2 text-sm"><option>Payment status</option></select>
        <button class="bg-offwhite border border-slate-200 text-sm font-medium px-4 py-2 rounded-lg">Filter</button>
      </div>

      <div class="flex justify-end">
        <button class="text-xs font-semibold text-navy border border-slate-200 px-4 py-2 rounded-lg">Export Report (requires reason + audit log)</button>
      </div>

    </main>
  </div>
</div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
